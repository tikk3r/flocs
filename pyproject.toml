[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flocs-runners"
version = "5.6.0"
description = ""
requires-python = ">3.9"
dependencies = ["structlog", "typer"]

[project.scripts]
flocs-create-ms-list = "flocs_runners.create_ms_list:main"
flocs-run = "flocs_runners.flocs_run:main"

[tool.setuptools]
packages = ["flocs_runners"]
