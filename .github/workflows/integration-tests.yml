# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: integration tests

on: workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check dependency installation
      run: |
        sudo apt -y install postgresql wget
        python -m pip install --upgrade pip "setuptools>=59.5.0,<82" uv
        uv pip install --system torch torchvision torchaudio xformers
        pip install --no-build-isolation -e "git+https://github.com/sara-nl/cortExchange#egg=cortexchange"
        python -m pip install flake8 "numpy<2" pytest wheel
        uv pip install --system pkg_resources
        if [ -f requirements.txt ]; then cat requirements.txt | xargs -n 1 uv pip install --no-build-isolation --system; fi
    - name: Check library imports
      run: |
        python tests/test_all_imports.py
